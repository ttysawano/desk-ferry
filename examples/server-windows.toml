[host]
name = "host1"
role = "server"
os = "windows"

[network]
bind_address = "0.0.0.0"
port = 24800

[security]
mode = "tls"
psk_file = "./secret.psk"
allow_plaintext = false
# Stage 2 mock-server only. Keep real cert/key files outside the repository.
# cert_file = "./local/server.crt"
# key_file = "./local/server.key"

[transition]
entry_margin_px = 2
cooldown_ms = 150
require_double_push = false
edge_activation_delay_ms = 0

[input]
emergency_hotkey = "Ctrl+Alt+Shift+Esc"
keyboard_mode = "physical_key"
ime_sync = false

[windows]
use_virtual_screen = true

[[windows.displays]]
alias = "main"
match_name = "DISPLAY1"

[[windows.displays]]
alias = "right"
match_name = "DISPLAY2"

[neighbors]
left = ""
right = ""
up = ""
down = ""

[display_neighbors.main]
left = ""
right = ""
up = ""
down = ""

[display_neighbors.right]
left = ""
right = "host2:left"
up = ""
down = ""

[clients.host2]
name = "host2"
allowed = true
expected_fingerprint = ""
